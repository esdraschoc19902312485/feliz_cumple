<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Heart Animation - Mi Foto Drive</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            background-color: #000; 
        }

        body {
            /* 🚨 ENLACE DIRECTO DE GOOGLE DRIVE (Usando el ID de tu foto) */
            background-image: url('https://drive.google.com/thumbnail?id=17yC6-pY1WIabgeDOjTRsmlZZC0sfS94J&sz=w1920');
            
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Un poco de oscuridad para que el neón resalte */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4); 
            z-index: 0;
        }

        #ui {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .love_word {
            position: absolute;
            color: #ea80b0;
            font-size: 1.1rem; 
            transform: translateY(-100%) rotateZ(-30deg);
            text-shadow: 0 0 10px #fff, 0 0 15px #ea80b0;
            letter-spacing: 2px;
            white-space: nowrap;
            opacity: 0.9;
        }

        @media (max-width: 600px) {
            .love_word { font-size: 0.8rem; }
        }
    </style>
</head>
<body>

    <div id="ui"></div>

    <script>
        const uiContainer = document.getElementById('ui');
        const word = "I love you";
        
        const totalWords = 90;    
        const speed = 0.0006;     
        const scale = 14;         

        const rawPoints = [];
        const steps = 5000;
        for (let i = 0; i < steps; i++) {
            const t = (i / steps) * Math.PI * 2;
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            rawPoints.push({ x, y });
        }

        let totalLength = 0;
        const distances = [0];
        for (let i = 1; i < rawPoints.length; i++) {
            const dx = rawPoints[i].x - rawPoints[i-1].x;
            const dy = rawPoints[i].y - rawPoints[i-1].y;
            totalLength += Math.sqrt(dx * dx + dy * dy);
            distances.push(totalLength);
        }

        const wordElements = [];
        const centerX = window.innerWidth / 2;
        const centerY = window.innerHeight / 2;

        for (let i = 0; i < totalWords; i++) {
            const span = document.createElement('span');
            span.className = 'love_word';
            span.innerText = word;
            uiContainer.appendChild(span);
            wordElements.push(span);
        }

        let animationTime = 0;

        function animate() {
            animationTime += speed;

            for (let i = 0; i < totalWords; i++) {
                let progress = ((i / totalWords) + animationTime) % 1;
                if (progress < 0) progress += 1;

                const targetDistance = progress * totalLength;

                let low = 0;
                let high = distances.length - 1;
                let idx = 0;

                while (low <= high) {
                    const mid = Math.floor((low + high) / 2);
                    if (distances[mid] < targetDistance) {
                        low = mid + 1;
                    } else {
                        idx = mid;
                        high = mid - 1;
                    }
                }

                const pt = rawPoints[idx];
                wordElements[i].style.left = `${centerX + (pt.x * scale)}px`;
                wordElements[i].style.top = `${centerY + (pt.y * scale)}px`;
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
